<div class="container mt-5 p-4 bg-gray-100 rounded shadow-lg">
    <h1 class="text-2xl font-semibold mb-4">Internal server error</h1>
    @if(error)
    {
    <h5 class="text-red-600">Error:{{error.message}}</h5>
    <p class="font-bol mb-2">This error comes from server, not Angular</p>
    <p class="mb-2">What to do next?</p>
    <ol class="list-decimal ml-5 mb-4">
        <li class="mb-1">Check the network tab in chrome tools</li>
        <li class="mb-1">Reproduce the error in postman.
            If same error, don't waste time troubleshooting agular code
        </li>
    </ol>
    <h5 class="text-lg font-semibold mb-2">Stack Trace</h5>
    <mat-card class="p-5 bg-white">
        <mat-card-content class="bg-white">
            <code class="block wrap-break-word">
            {{error.details}}</code>
        </mat-card-content>
    </mat-card>
    }
</div>
